{% extends "base.html" %}
{% block title %}Delete Job — ResumeAI{% endblock %}
{% block page_title %}Delete Job{% endblock %}
{% block content %}
<div class="card-panel" style="max-width:480px;">
  <div class="text-center py-3">
    <div style="font-size:3rem;color:#ef4444;"><i class="fas fa-exclamation-triangle"></i></div>
    <h4 class="mt-3">Delete Job Post?</h4>
    <p class="text-muted">This will permanently delete <strong>"{{ job.job_title }}"</strong> and all related applications and analyses.</p>
    <form method="post" class="d-flex gap-3 justify-content-center mt-4">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger px-4"><i class="fas fa-trash me-2"></i>Yes, Delete</button>
      <a href="{% url 'hr_job_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
